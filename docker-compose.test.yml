services:
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: sentio
      POSTGRES_PASSWORD: sentio
      POSTGRES_DB: sentio_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentio -d sentio_test"]
      interval: 1s
      timeout: 3s
      retries: 30