version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build:
      context: ..
    # Use the API Dockerfile by default build stage
    dockerfile: docker/Dockerfile.api
    env_file: ../.env.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      retries: 6

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    env_file: ../.env.example
    depends_on:
      - api
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: ../.env.example
    depends_on:
      - redis

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: ../.env.example
    command: ["python", "-m", "app.workers.tasks_slots"]
    depends_on:
      - redis
      - postgres

volumes:
  pgdata: {}
  redisdata: {}
