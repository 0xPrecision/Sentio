services:
  postgres:
    image: postgres:16
    container_name: sentio-postgres-dev
    environment:
      POSTGRES_DB: sentio
      POSTGRES_USER: sentio
      POSTGRES_PASSWORD: sentio
    ports:
      - "5432:5432"
    volumes:
      - "sentio_pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentio -d sentio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sentio_pgdata: