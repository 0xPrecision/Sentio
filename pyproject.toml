 [tool.poetry]
 name = "sentio"
 version = "0.1.0"
 description = "SaaS Telegram booking bot for services"
 authors = ["0xPrecision"]
 readme = "README.md"
 package-mode = true

 [tool.poetry.dependencies]
 python = "^3.13"
 fastapi = "^0.121.3"
 aiogram = "^3.22.0"
 SQLAlchemy = "^2.0.40"
 alembic = "^1.17.2"
 uvicorn = { extras = ["standard"], version = "^0.32.1" }
 redis = "^5.2.0"
 httpx = "^0.28.1"
 pydantic-settings = "^2.12.0"

 [tool.poetry.group.dev.dependencies]
 pytest = "^9.0.1"
 pytest-asyncio = "^1.3.0"
 black = "^25.11.0"
 ruff = "^0.14.6"
 mypy = "^1.18.2"
 pre-commit = "^4.5.0"

 [tool.black]
line-length = 100
target-version = ["py313"]

 [tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E203"]
fixable = ["ALL"]
unfixable = []

 [tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
plugins = []

 [tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]

 [build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"