 [tool.poetry]
 name = "Sentio"
 version = "0.1.0"
 description = "SaaS Telegram booking bot for services"
 authors = ["0xPrecision"]
 readmy = "READMI.md"
 package-mode = true

 [tool.poetry.dependencies]
 python = "^3.12"
 fastapi = "^0.121.3"
 aiogram = "^3.22.0"
 SQLAlchemy = "^2.0.40"
 alembic = "^1.17.2"
 pydantic = "^2.12.4"
 pydantic-settings = "^2.12.0"
 uvicorn = { extras = ["standard"], version = "^0.32.1" }
 redis = "^5.2.0"
 httpx = "^0.28.1"

 [tool.poetry.group.dev.dependencies]
 pytest = "^9.0.1"
 pytest-asyncio = "^1.3.0"
 black = "^25.11.0"
 ruff = "^0.14.6"
 mypy = "^1.18.2"
 pre-commit = "^4.5.0"