[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-saas"
version = "0.2.0"
description = "Multi-tenant Telegram booking micro-SaaS"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.2",
  "redis>=5.0.6",
  "dramatiq[redis,watch]>=1.16.0",
  "apscheduler>=3.10.4",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.2",
  "prometheus-client>=0.20.0",
  "structlog>=24.1.0",
  "orjson>=3.10.7",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-xdist>=3.6.1",
  "mypy>=1.11.1",
  "ruff>=0.6.8"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
plugins = []

[tool.setuptools]
packages = ["app"]